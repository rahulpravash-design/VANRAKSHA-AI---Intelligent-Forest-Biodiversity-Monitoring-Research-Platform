name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      # Runs from the repo root so it picks up the shared [tool.ruff] config
      # in pyproject.toml (it also covers ai/ and scripts/).
      - name: Ruff
        run: ruff check .

      # Runs from the repo root so it picks up [tool.pytest.ini_options] in
      # pyproject.toml, which sets testpaths and the pythonpath the backend
      # and ai packages need. The suite is self-contained — conftest.py
      # points it at a throwaway SQLite database, no services required.
      - name: Pytest
        run: pytest

  migrations:
    name: Alembic migrations on PostGIS
    runs-on: ubuntu-latest
    # Confirms the migrations apply cleanly against the same engine
    # docker-compose runs in production (postgis/postgis) — the pytest suite
    # above only ever exercises SQLite, so this is the one place a
    # Postgres-only issue (constraint behaviour, dialect quirks) would surface.
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: vanraksha
          POSTGRES_PASSWORD: vanraksha
          POSTGRES_DB: vanraksha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vanraksha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://vanraksha:vanraksha@localhost:5432/vanraksha
        run: alembic upgrade head

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
