# Repository-wide tooling configuration.
#
# The backend, the AI engine and the scripts are separate deployables with their
# own requirements files, but they share one lint and test configuration so a
# rule cannot pass in one directory and fail in another.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "node_modules", "frontend", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI's Depends()/Query() defaults are the documented idiom
    "RUF012",  # ClassVar annotations add noise to SQLAlchemy models
    "SIM108",  # a ternary is not always clearer than an if/else
    "RUF002",  # en dashes in prose docstrings are deliberate
    "RUF003",  # ditto for the minus sign in "top1 − top2"
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E402"]   # env must be configured before importing the app
"ai/training/*" = ["E402"]     # optional heavy imports stay inside main()

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ai/tests"]
pythonpath = [".", "backend"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"
